<circle cx="26" cy="29" r="6.5" fill="#ff5f57"/><circle cx="48" cy="29" r="6.5" fill="#febc2e"/><circle cx="70" cy="29" r="6.5" fill="#28c840"/>
<text x="470" y="34" text-anchor="middle" fill="#8b949e" font-size="13">mcp-doctor · evals and guardrails for AI agents and the MCP tools they call</text>
<line x1="0" y1="360" x2="940" y2="360" stroke="#161b22" stroke-width="2"/>
<g class="k1 s0"><text x="916" y="46" text-anchor="end" fill="#8b949e" font-size="12.5">1/3  Build</text><text x="470" y="383" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Lint the server before an agent ever calls it</text></g><g class="k2 s0"><text x="24" y="74"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">mcp-doctor examples/bad_server</tspan></text><rect class="ck3 s0c" x="40.260000000000005" y="59" width="264" height="21" fill="#0d1117"/></g><text class="k4 s0" x="24" y="95" xml:space="preserve"><tspan fill="#8b949e">mcp-doctor report</tspan></text><text class="k5 s0" x="24" y="116" xml:space="preserve"><tspan fill="#3fb950">No known agent-breaking issues </tspan><tspan fill="#8b949e">(checked: null defaults, stdout on stdio, mcp 2.x start-up)</tspan></text><text class="k6 s0" x="24" y="137" xml:space="preserve"><tspan fill="#e6edf3">Quality:  24%  Grade: </tspan><tspan fill="#f85149">F</tspan><tspan fill="#8b949e">  (2 tool(s) found)</tspan></text><text class="k7 s0" x="24" y="158" xml:space="preserve"><tspan fill="#e6edf3">Security: 100%  Grade: </tspan><tspan fill="#3fb950">A</tspan></text><text class="k8 s0" x="24" y="179" xml:space="preserve"><tspan fill="#f85149">  [FAIL] </tspan><tspan fill="#e6edf3">do_thing (server.py:12)</tspan></text><text class="k9 s0" x="24" y="200" xml:space="preserve"><tspan fill="#f85149">      ERROR  </tspan><tspan fill="#e6edf3">Tool has no description. An agent cannot decide when to call this.</tspan></text><text class="k10 s0" x="24" y="221" xml:space="preserve"><tspan fill="#d29922">      WARNING  </tspan><tspan fill="#e6edf3">2/2 parameters have no type annotation.</tspan></text><text class="k11 s0" x="24" y="242" xml:space="preserve"><tspan fill="#d29922">      WARNING  </tspan><tspan fill="#e6edf3">Parameters aren&#x27;t documented — … the model only sees names, not intent.</tspan></text><text class="k12 s0" x="24" y="263" xml:space="preserve"><tspan fill="#d29922">      WARNING  </tspan><tspan fill="#e6edf3">No try/except in this function&#x27;s own body. …</tspan></text><text class="k13 s0" x="24" y="284" xml:space="preserve"><tspan fill="#f85149">  [FAIL] </tspan><tspan fill="#e6edf3">run (server.py:18)</tspan></text><text class="k14 s0" x="24" y="305" xml:space="preserve"><tspan fill="#f85149">      ERROR  </tspan><tspan fill="#e6edf3">Tool has no description. An agent cannot decide when to call this.</tspan></text><text class="k15 s0" x="24" y="326" xml:space="preserve"><tspan fill="#f85149">      ERROR  </tspan><tspan fill="#e6edf3">Bare &#x27;except:&#x27; swallows all errors including cancellation — catch …</tspan></text><text class="k16 s0" x="24" y="347" xml:space="preserve"><tspan fill="#8b949e">Repo-level  </tspan><tspan fill="#f85149">ERROR  </tspan><tspan fill="#e6edf3">No README found.</tspan></text><g class="k17"><text x="916" y="46" text-anchor="end" fill="#8b949e" font-size="12.5">2/3  Release</text><text x="470" y="383" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Launch it, fuzz it, and get one decision</text></g><g class="k18"><text x="24" y="74"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">mcp-doctor verdict examples/bad_server --run &quot;python examples/bad_server/server.py&quot;</tspan></text><rect class="ck19" x="40.260000000000005" y="59" width="695" height="21" fill="#0d1117"/></g><text class="k20" x="24" y="95" xml:space="preserve"><tspan fill="#e6edf3">mcp-doctor verdict: </tspan><tspan fill="#f85149">BLOCK</tspan><tspan fill="#8b949e"> (HIGH confidence) · static 24% (F)</tspan></text><text class="k21" x="24" y="116" xml:space="preserve"><tspan fill="#f85149">Blockers</tspan><tspan fill="#8b949e"> (any one of these blocks release):</tspan></text><text class="k22" x="24" y="137" xml:space="preserve"><tspan fill="#e6edf3">- fuzz: server never connected (MCPError: Connection closed)</tspan></text><text class="k23" x="24" y="158" xml:space="preserve"><tspan fill="#e6edf3">- fuzz --truth: server never connected (MCPError: Connection closed)</tspan></text><text class="k24" x="24" y="179" xml:space="preserve"><tspan fill="#d29922">Fix first</tspan><tspan fill="#8b949e"> (shippable once addressed, or knowingly accepted):</tspan></text><text class="k25" x="24" y="200" xml:space="preserve"><tspan fill="#e6edf3">- static scan: 4 spec/documentation errors</tspan></text><text class="k26" x="24" y="221" xml:space="preserve"><tspan fill="#e6edf3"></tspan></text><g class="k27"><text x="24" y="242"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">mcp-doctor verdict examples/good_server --run &quot;python examples/good_server/server.py&quot; \</tspan></text><rect class="ck28" x="40.260000000000005" y="227" width="727" height="21" fill="#0d1117"/></g><text class="k29" x="24" y="263" xml:space="preserve"><tspan fill="#e6edf3">    --include-destructive</tspan></text><text class="k30" x="24" y="284" xml:space="preserve"><tspan fill="#e6edf3">mcp-doctor verdict: </tspan><tspan fill="#3fb950">SHIP</tspan><tspan fill="#8b949e"> (HIGH confidence) · static 100% (A) · fuzz 100% (A) · truth 100% (A)</tspan></text><text class="k31" x="24" y="305" xml:space="preserve"><tspan fill="#e6edf3">No rule fired. </tspan><tspan fill="#8b949e">fuzz called 1 of 1 tools (100%).</tspan></text><g class="k32"><text x="916" y="46" text-anchor="end" fill="#8b949e" font-size="12.5">3/3  Production</text><text x="470" y="383" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Catch a &quot;success&quot; that didn&#x27;t happen, live</text></g><g class="k33"><text x="24" y="74"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">mcp-doctor guard -- python tests/fixtures/guard_server.py fs_broken</tspan></text><rect class="ck34" x="40.260000000000005" y="59" width="565" height="21" fill="#0d1117"/></g><text class="k35" x="24" y="95" xml:space="preserve"><tspan fill="#58a6ff">agent  → </tspan><tspan fill="#e6edf3">tools/call write_file {&quot;path&quot;: &quot;/tmp/report.md&quot;, &quot;content&quot;: &quot;# Q3 report&quot;}</tspan></text><text class="k36" x="24" y="116" xml:space="preserve"><tspan fill="#bc8cff">server → </tspan><tspan fill="#e6edf3">&quot;Successfully wrote to /tmp/report.md&quot;</tspan></text><text class="k37" x="24" y="137" xml:space="preserve"><tspan fill="#d29922">guard  → </tspan><tspan fill="#d29922">⚠ mcp-doctor guard: write_file reported success, but reading it back with</tspan></text><text class="k38" x="24" y="158" xml:space="preserve"><tspan fill="#e6edf3">         </tspan><tspan fill="#d29922">get_file_info(path=&#x27;/tmp/report.md&#x27;) failed: &quot;Error: ENOENT: no such file</tspan></text><text class="k39" x="24" y="179" xml:space="preserve"><tspan fill="#e6edf3">         </tspan><tspan fill="#d29922">or directory, …&quot;. The write may not have happened.</tspan></text><text class="k40" x="24" y="200" xml:space="preserve"><tspan fill="#e6edf3"></tspan></text><text class="k41" x="24" y="221" xml:space="preserve"><tspan fill="#8b949e">The result still says success (isError: false); guard adds the warning the agent reads,</tspan></text><text class="k42" x="24" y="242" xml:space="preserve"><tspan fill="#8b949e">so it can retry or tell you instead of saying &quot;done&quot;.</tspan></text>
</svg>
