0}}.k29{animation:k29 27.0s linear infinite}@keyframes k30{0%,50.953%{opacity:0}50.963%,68.119%{opacity:1}68.519%,100%{opacity:0}}.k30{animation:k30 27.0s linear infinite}@keyframes k31{0%,51.397%{opacity:0}51.407%,68.119%{opacity:1}68.519%,100%{opacity:0}}.k31{animation:k31 27.0s linear infinite}@keyframes k32{0%,68.509%{opacity:0}68.519%,99.600%{opacity:1}100.000%,100%{opacity:0}}.k32{animation:k32 27.0s linear infinite}@keyframes k33{0%,69.990%{opacity:0}70.000%,99.600%{opacity:1}100.000%,100%{opacity:0}}.k33{animation:k33 27.0s linear infinite}@keyframes k34{0%,69.990%{opacity:0}70.000%,99.600%{opacity:1}100.000%,100%{opacity:0}}.k34{animation:k34 27.0s linear infinite}@keyframes ck34{0%,70.000%{transform:translateX(0)}75.926%,100%{transform:translateX(565px)}}.ck34{animation:ck34 27.0s steps(67) infinite}@keyframes k35{0%,77.212%{opacity:0}77.222%,99.600%{opacity:1}100.000%,100%{opacity:0}}.k35{animation:k35 27.0s linear infinite}@keyframes k36{0%,77.657%{opacity:0}77.667%,99.600%{opacity:1}100.000%,100%{opacity:0}}.k36{animation:k36 27.0s linear infinite}@keyframes k37{0%,78.101%{opacity:0}78.111%,99.600%{opacity:1}100.000%,100%{opacity:0}}.k37{animation:k37 27.0s linear infinite}@keyframes k38{0%,78.546%{opacity:0}78.556%,99.600%{opacity:1}100.000%,100%{opacity:0}}.k38{animation:k38 27.0s linear infinite}@keyframes k39{0%,78.990%{opacity:0}79.000%,99.600%{opacity:1}100.000%,100%{opacity:0}}.k39{animation:k39 27.0s linear infinite}@keyframes k40{0%,79.434%{opacity:0}79.444%,99.600%{opacity:1}100.000%,100%{opacity:0}}.k40{animation:k40 27.0s linear infinite}@keyframes k41{0%,79.879%{opacity:0}79.889%,99.600%{opacity:1}100.000%,100%{opacity:0}}.k41{animation:k41 27.0s linear infinite}@keyframes k42{0%,80.323%{opacity:0}80.333%,99.600%{opacity:1}100.000%,100%{opacity:0}}.k42{animation:k42 27.0s linear infinite}
