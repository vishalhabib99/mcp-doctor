name: Leaderboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC — catches upstream repo/star changes independent of our own commits
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # read: opted-in scan requests join the leaderboard; write: tool-count alarm issue
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e .
      - name: Scan seed repos with the current checkout's mcp-doctor
        env:
          GH_TOKEN: ${{ github.token }}
          ALARMS_FILE: ${{ runner.temp }}/tool-count-alarms.md
        run: python leaderboard/scan.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: leaderboard
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Open an issue if a server's tool count collapsed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/tool-count-alarms.md"
          [ -s "$f" ] || { echo "No tool-count alarms."; exit 0; }
          body="$(printf 'The leaderboard rescan at %s found tool counts that fell to 0 or by more than 20%% since the last published scan. A grade built on missing tools is wrong, so check each one.\n\n' "${GITHUB_SHA::7}"; cat "$f")"
          open=$(gh issue list --label recall-alarm --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Leaderboard: tool count dropped" --label recall-alarm --body "$body"
          fi
