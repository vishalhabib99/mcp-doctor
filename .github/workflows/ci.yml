name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: pytest -q
      - name: Dogfood on our own example servers
        run: |
          python -m mcp_doctor.cli examples/good_server --fail-under 90
          python -m mcp_doctor.cli examples/bad_server --json
          python -m mcp_doctor.cli examples/good_server_ts --fail-under 90
          python -m mcp_doctor.cli examples/bad_server_ts --json
