name: "mcp-doctor"
description: "Audit an MCP server, fuzz it, and gate PRs on the score or on one release decision: SHIP, FIX-FIRST or BLOCK."
author: "Vishal Habib"
branding:
  icon: "activity"
  color: "purple"

inputs:
  path:
    description: "Path to the repo/server to audit, relative to the checkout."
    required: false
    default: "."
  fail-under:
    description: "Fail the workflow if the score percent is below this threshold. 0 disables gating."
    required: false
    default: "0"
  comment:
    description: "Post the report as a comment on the triggering pull request."
    required: false
    default: "true"
  suggest-fixes:
    description: "On a pull request, post mcp-doctor's safe fixes as one-click review suggestions on the lines the PR changes, and list the rest (with a patch) in the report comment. Needs `pull-requests: write`."
    required: false
    default: "true"
  suggest-doc-stubs:
    description: "Also suggest missing `Args:` entries for undocumented parameters. Off by default: the suggestion is a `TODO: describe this parameter.` placeholder, so the report counts those tools instead."
    required: false
    default: "false"
  run:
    description: "Command that starts the server over stdio, e.g. `python server.py`. When set (or `url`), the Action also launches the server, fuzzes it with bad and valid input, and posts a SHIP / FIX-FIRST / BLOCK verdict. Only tools marked readOnlyHint are called unless include-destructive is true."
    required: false
    default: ""
  url:
    description: "A running server's Streamable HTTP URL, instead of `run`."
    required: false
    default: ""
  headers:
    description: "HTTP headers for `url`, one KEY=VALUE per line (pass secrets through `${{ secrets.X }}`)."
    required: false
    default: ""
  env:
    description: "Environment variables for `run`, space-separated KEY=VALUE pairs."
    required: false
    default: ""
  include-destructive:
    description: "Also call tools not marked readOnlyHint. Only against a sandbox."
    required: false
    default: "false"
  fail-on:
    description: "With `run` or `url`: fail the workflow on this verdict or worse, BLOCK or FIX-FIRST. Empty never fails on the verdict."
    required: false
    default: ""
  version:
    description: "Git ref of mcp-doctor to install (branch, tag, or commit). Empty (the default) installs the copy of mcp-doctor this action was checked out at, so pinning the action by commit also pins the analyser."
    required: false
    default: ""

outputs:
  score:
    description: "Score percent (0-100)."
    value: ${{ steps.audit.outputs.score }}
  grade:
    description: "Letter grade (A-F), or N/A when no tools were found."
    value: ${{ steps.audit.outputs.grade }}
  graded:
    description: "'false' when no tools were found: the score is then not a grade, and fail-under is not applied (a warning is shown instead)."
    value: ${{ steps.audit.outputs.graded }}

  decision:
    description: "SHIP, FIX-FIRST or BLOCK when `run` or `url` is set, otherwise empty."
    value: ${{ steps.verdict.outputs.decision }}
  confidence:
    description: "HIGH, MEDIUM or LOW: how much of the server the runtime checks actually called."
    value: ${{ steps.verdict.outputs.confidence }}
  needs-human-review:
    description: "'true' unless the verdict is a HIGH-confidence SHIP."
    value: ${{ steps.verdict.outputs.needs-human-review }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.14"

    - name: Install mcp-doctor
      shell: bash
      # Installed from outside the checkout, so nothing in the scanned repo is on the path.
      working-directory: ${{ runner.temp }}
      env:
        VERSION: ${{ inputs.version }}
        RUNTIME: ${{ inputs.run != '' || inputs.url != '' }}
      run: |
        # The runtime checks need the MCP SDK, an optional extra.
        extra=""
        if [ "$RUNTIME" = "true" ]; then extra="[runtime]"; fi
        if [ -z "$VERSION" ]; then
          pip install "$GITHUB_ACTION_PATH$extra"
        else
          pip install "mcp-server-lint$extra @ git+https://github.com/vishalhabib99/mcp-doctor.git@$VERSION"
        fi

    - name: Run audit
      id: audit
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        set +e
        mcp-doctor "$SCAN_PATH" --no-color > mcp-doctor-report.txt
        text_status=$?
        mcp-doctor "$SCAN_PATH" --json > mcp-doctor-report.json
        set -e

        score=$(python -I -c "import json;print(json.load(open('mcp-doctor-report.json'))['percent'])")
        grade=$(python -I -c "import json;print(json.load(open('mcp-doctor-report.json'))['grade'])")
        graded=$(python -I -c "import json;print(str(json.load(open('mcp-doctor-report.json')).get('graded', True)).lower())")
        echo "score=$score" >> "$GITHUB_OUTPUT"
        echo "grade=$grade" >> "$GITHUB_OUTPUT"
        echo "graded=$graded" >> "$GITHUB_OUTPUT"

        {
          echo "## mcp-doctor report"
          echo '```'
          cat mcp-doctor-report.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        fail_under="$FAIL_UNDER"
        if [ "$graded" != "true" ]; then
          # 0 tools: no quality score to gate on. Warn instead of a silent pass (bug #102).
          if [ "$fail_under" != "0" ]; then
            echo "::warning::mcp-doctor found 0 tools, so the fail-under $fail_under% gate was not applied. If this server has tools, they may be named at runtime, or it's a mcp-doctor miss."
          fi
          echo "gate_failed=0" >> "$GITHUB_OUTPUT"
        elif [ "$fail_under" != "0" ] && [ "$score" -lt "$fail_under" ]; then
          echo "::error::mcp-doctor score $score% is below the required $fail_under%"
          echo "gate_failed=1" >> "$GITHUB_OUTPUT"
        else
          echo "gate_failed=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Fuzz the server and decide
      id: verdict
      if: ${{ inputs.run != '' || inputs.url != '' }}
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        RUN_CMD: ${{ inputs.run }}
        MCP_URL: ${{ inputs.url }}
        MCP_HEADERS: ${{ inputs.headers }}
        MCP_ENV: ${{ inputs.env }}
        DESTRUCTIVE: ${{ inputs.include-destructive }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [ -n "$RUN_CMD" ] && [ -n "$MCP_URL" ]; then
          echo "::error::Set either 'run' (launch a local stdio server) or 'url' (a running HTTP server), not both."
          exit 1
        fi
        ARGS=()
        if [ -n "$MCP_URL" ]; then
          ARGS+=(--url "$MCP_URL")
          while IFS= read -r header; do
            [ -n "$header" ] && ARGS+=(--header "$header")
          done <<< "$MCP_HEADERS"
        else
          ARGS+=(--run "$RUN_CMD")
          for kv in $MCP_ENV; do ARGS+=(--env "$kv"); done
        fi
        if [ "$DESTRUCTIVE" = "true" ]; then ARGS+=(--include-destructive); fi
        set +e
        mcp-doctor verdict "$SCAN_PATH" "${ARGS[@]}" --json > mcp-doctor-verdict.json
        set -e
        python -I - <<'PY'
        import json, os
        v = json.load(open("mcp-doctor-verdict.json"))
        scores = " · ".join(f"{k} {x:.0f}%" for k, x in v["scores"].items() if isinstance(x, (int, float)))
        md = f"### mcp-doctor verdict — {v['verdict']} ({v['confidence']} confidence) · {scores}\n\n" + v["markdown"]
        open("mcp-doctor-verdict.md", "w").write(md)
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"decision={v['verdict']}\nconfidence={v['confidence']}\n")
            f.write(f"needs-human-review={str(v['needs_human_review']).lower()}\n")
            fail_on = os.environ.get("FAIL_ON", "")
            failed = (fail_on == "BLOCK" and v["verdict"] == "BLOCK") or (fail_on == "FIX-FIRST" and v["verdict"] in ("BLOCK", "FIX-FIRST"))
            f.write(f"gate_failed={1 if failed else 0}\n")
        PY
        cat mcp-doctor-verdict.md >> "$GITHUB_STEP_SUMMARY"

    - name: Suggest fixes on pull request
      id: suggest
      if: ${{ inputs.suggest-fixes == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SCAN_PATH: ${{ inputs.path }}
        DOC_STUBS: ${{ inputs.suggest-doc-stubs }}
      run: |
        # Suggestions are a convenience: a failure here (e.g. a read-only
        # token on a fork's PR) warns instead of failing the check.
        set +e
        gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | {filename, patch}' > mcp-doctor-pr-files.ndjson \
          || { echo "::warning::mcp-doctor: couldn't read the PR's files; skipping fix suggestions"; exit 0; }
        gh api "repos/$REPO/pulls/$PR/comments" --paginate \
          --jq '.[] | select(.body | contains("<!-- mcp-doctor-fix -->")) | {path, line, body}' > mcp-doctor-existing.ndjson
        # -I: the scanned repo is the working directory, and a json.py or
        # mcp_doctor/ in it must not shadow the installed modules.
        python -I -m mcp_doctor.suggest "$SCAN_PATH" mcp-doctor-pr-files.ndjson \
          --existing mcp-doctor-existing.ndjson --commit "$HEAD_SHA" \
          --review-out mcp-doctor-review.json --summary-out mcp-doctor-fixes.md \
          $([ "$DOC_STUBS" = "true" ] && echo --doc-stubs) \
          || { echo "::warning::mcp-doctor: couldn't plan fix suggestions"; exit 0; }
        if [ -f mcp-doctor-review.json ]; then
          if gh api -X POST "repos/$REPO/pulls/$PR/reviews" --input mcp-doctor-review.json > /dev/null; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            # Kept for the mcp-doctor-comment workflow (a fork's PR gets a read-only token).
            echo "posted=false" >> "$GITHUB_OUTPUT"
          fi
        fi
        exit 0

    - name: Comment on pull request
      id: comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        GRADED: ${{ steps.audit.outputs.graded }}
        SCORE: ${{ steps.audit.outputs.score }}
        GRADE: ${{ steps.audit.outputs.grade }}
      run: |
        {
          echo "<!-- mcp-doctor-report -->"
          if [ "$GRADED" = "true" ]; then
            echo "### mcp-doctor report — Score: $SCORE% ($GRADE)"
          else
            echo "### mcp-doctor report — Not graded (0 tools found)"
          fi
          echo
          echo '```'
          cat mcp-doctor-report.txt
          echo '```'
          if [ -f mcp-doctor-verdict.md ]; then echo; cat mcp-doctor-verdict.md; fi
          if [ -f mcp-doctor-fixes.md ]; then cat mcp-doctor-fixes.md; fi
        } > mcp-doctor-comment.md
        if gh pr comment "$PR" --repo "$REPO" \
             --body-file mcp-doctor-comment.md \
             --edit-last || \
           gh pr comment "$PR" --repo "$REPO" \
             --body-file mcp-doctor-comment.md; then
          echo "posted=true" >> "$GITHUB_OUTPUT"
        else
          echo "posted=false" >> "$GITHUB_OUTPUT"
          echo "::notice::mcp-doctor: couldn't comment with this token (a fork's PR gets a read-only one), so the report is saved for the mcp-doctor-comment workflow to post. Add it with \`mcp-doctor init-action\`; meanwhile the report is in the job summary."
        fi

    - name: Save the report for the comment workflow
      id: handoff
      if: ${{ github.event_name == 'pull_request' && (steps.comment.outputs.posted == 'false' || steps.suggest.outputs.posted == 'false') }}
      shell: bash
      env:
        COMMENT_POSTED: ${{ steps.comment.outputs.posted }}
        SUGGEST_POSTED: ${{ steps.suggest.outputs.posted }}
      run: |
        mkdir -p mcp-doctor-handoff
        if [ "$COMMENT_POSTED" = "false" ]; then cp mcp-doctor-comment.md mcp-doctor-handoff/comment.md; fi
        if [ "$SUGGEST_POSTED" = "false" ]; then cp mcp-doctor-review.json mcp-doctor-handoff/review.json; fi

    - name: Upload the saved report
      if: ${{ steps.handoff.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: mcp-doctor-report
        path: mcp-doctor-handoff/
        retention-days: 3
        if-no-files-found: ignore

    - name: Enforce score gate
      if: ${{ steps.audit.outputs.gate_failed == '1' }}
      shell: bash
      run: exit 1

    - name: Enforce verdict gate
      if: ${{ steps.verdict.outputs.gate_failed == '1' }}
      shell: bash
      env:
        DECISION: ${{ steps.verdict.outputs.decision }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::mcp-doctor verdict is $DECISION (fail-on: $FAIL_ON)"
        exit 1
