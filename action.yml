name: "mcp-doctor"
description: "Audit an MCP server implementation for spec conformance and quality issues, and gate PRs on the score."
author: "Vishal Habib"
branding:
  icon: "activity"
  color: "purple"

inputs:
  path:
    description: "Path to the repo/server to audit, relative to the checkout."
    required: false
    default: "."
  fail-under:
    description: "Fail the workflow if the score percent is below this threshold. 0 disables gating."
    required: false
    default: "0"
  comment:
    description: "Post the report as a comment on the triggering pull request."
    required: false
    default: "true"
  suggest-fixes:
    description: "On a pull request, post mcp-doctor's safe fixes as one-click review suggestions on the lines the PR changes, and list the rest (with a patch) in the report comment. Needs `pull-requests: write`."
    required: false
    default: "true"
  version:
    description: "Git ref of mcp-doctor to install (branch, tag, or commit)."
    required: false
    default: "main"

outputs:
  score:
    description: "Score percent (0-100)."
    value: ${{ steps.audit.outputs.score }}
  grade:
    description: "Letter grade (A-F)."
    value: ${{ steps.audit.outputs.grade }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install mcp-doctor
      shell: bash
      run: pip install "git+https://github.com/vishalhabib99/mcp-doctor.git@${{ inputs.version }}"

    - name: Run audit
      id: audit
      shell: bash
      run: |
        set +e
        mcp-doctor "${{ inputs.path }}" --no-color > mcp-doctor-report.txt
        text_status=$?
        mcp-doctor "${{ inputs.path }}" --json > mcp-doctor-report.json
        set -e

        score=$(python -c "import json;print(json.load(open('mcp-doctor-report.json'))['percent'])")
        grade=$(python -c "import json;print(json.load(open('mcp-doctor-report.json'))['grade'])")
        echo "score=$score" >> "$GITHUB_OUTPUT"
        echo "grade=$grade" >> "$GITHUB_OUTPUT"

        {
          echo "## mcp-doctor report"
          echo '```'
          cat mcp-doctor-report.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        fail_under="${{ inputs.fail-under }}"
        if [ "$fail_under" != "0" ] && [ "$score" -lt "$fail_under" ]; then
          echo "::error::mcp-doctor score $score% is below the required $fail_under%"
          echo "gate_failed=1" >> "$GITHUB_OUTPUT"
        else
          echo "gate_failed=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Suggest fixes on pull request
      if: ${{ inputs.suggest-fixes == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SCAN_PATH: ${{ inputs.path }}
      run: |
        # Suggestions are a convenience: a failure here (e.g. a read-only
        # token on a fork's PR) warns instead of failing the check.
        set +e
        gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | {filename, patch}' > mcp-doctor-pr-files.ndjson \
          || { echo "::warning::mcp-doctor: couldn't read the PR's files; skipping fix suggestions"; exit 0; }
        gh api "repos/$REPO/pulls/$PR/comments" --paginate \
          --jq '.[] | select(.body | contains("<!-- mcp-doctor-fix -->")) | {path, line, body}' > mcp-doctor-existing.ndjson
        python -m mcp_doctor.suggest "$SCAN_PATH" mcp-doctor-pr-files.ndjson \
          --existing mcp-doctor-existing.ndjson --commit "$HEAD_SHA" \
          --review-out mcp-doctor-review.json --summary-out mcp-doctor-fixes.md \
          || { echo "::warning::mcp-doctor: couldn't plan fix suggestions"; exit 0; }
        if [ -f mcp-doctor-review.json ]; then
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" --input mcp-doctor-review.json > /dev/null \
            || echo "::warning::mcp-doctor: couldn't post fix suggestions (the workflow needs pull-requests: write)"
        fi
        exit 0

    - name: Comment on pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        {
          echo "### mcp-doctor report — Score: ${{ steps.audit.outputs.score }}% (${{ steps.audit.outputs.grade }})"
          echo
          echo '```'
          cat mcp-doctor-report.txt
          echo '```'
          if [ -f mcp-doctor-fixes.md ]; then cat mcp-doctor-fixes.md; fi
        } > mcp-doctor-comment.md
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" \
          --body-file mcp-doctor-comment.md \
          --edit-last || \
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" \
          --body-file mcp-doctor-comment.md || \
        echo "::warning::mcp-doctor: couldn't comment on the PR (a fork's PR gets a read-only token, or the workflow needs pull-requests: write); the report is in the job summary"

    - name: Enforce score gate
      if: ${{ steps.audit.outputs.gate_failed == '1' }}
      shell: bash
      run: exit 1
