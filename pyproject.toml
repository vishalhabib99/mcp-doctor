[project]
name = "mcp-server-lint"
version = "0.4.4"
description = "Static analysis CLI that audits MCP (Model Context Protocol) server implementations for spec conformance and quality issues."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vishal Habib" }]
keywords = ["mcp", "model-context-protocol", "agents", "llm", "linter", "static-analysis"]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/vishalhabib99/mcp-doctor"
Issues = "https://github.com/vishalhabib99/mcp-doctor/issues"

[project.scripts]
mcp-doctor = "mcp_doctor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
